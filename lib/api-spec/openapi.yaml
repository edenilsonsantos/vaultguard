openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Password Vault API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: vault
    description: Vault items
  - name: apikeys
    description: API key management
  - name: certificates
    description: Certificate management
  - name: logs
    description: Audit logs
  - name: settings
    description: Application settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful or 2FA required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/check-reset:
    get:
      operationId: checkPasswordReset
      tags: [auth]
      summary: Check if a username requires a password reset
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reset status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResetResponse"

  /auth/set-password:
    post:
      operationId: setInitialPassword
      tags: [auth]
      summary: Set new password after admin reset (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordBody"
      responses:
        "200":
          description: Password set, JWT returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/2fa/setup:
    post:
      operationId: setupTwoFactor
      tags: [auth]
      summary: Generate a TOTP secret and QR code for 2FA setup
      responses:
        "200":
          description: 2FA setup info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorSetup"

  /auth/2fa/confirm:
    post:
      operationId: confirmTwoFactor
      tags: [auth]
      summary: Confirm TOTP OTP and enable 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTwoFactorBody"
      responses:
        "200":
          description: 2FA enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/2fa/disable:
    post:
      operationId: disableTwoFactor
      tags: [auth]
      summary: Disable 2FA for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTwoFactorBody"
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      tags: [auth]
      summary: Verify TOTP OTP to complete login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTwoFactorBody"
      responses:
        "200":
          description: Login complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid OTP or temp token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Users
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Force password reset for a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Password reset flagged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/toggle-active:
    patch:
      operationId: toggleUserActive
      tags: [users]
      summary: Toggle user active status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "400":
          description: Cannot disable last active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Vault Items
  /vault:
    get:
      operationId: listVaultItems
      tags: [vault]
      summary: List vault items accessible to current user
      responses:
        "200":
          description: List of vault items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultItemSummary"

    post:
      operationId: createVaultItem
      tags: [vault]
      summary: Create a new vault item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultItemBody"
      responses:
        "201":
          description: Created vault item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItem"

  /vault/{id}:
    get:
      operationId: getVaultItem
      tags: [vault]
      summary: Get a vault item with its entries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vault item with entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItem"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateVaultItem
      tags: [vault]
      summary: Update a vault item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVaultItemBody"
      responses:
        "200":
          description: Updated vault item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItem"

    delete:
      operationId: deleteVaultItem
      tags: [vault]
      summary: Delete a vault item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vault/trash:
    get:
      operationId: listVaultTrash
      tags: [vault]
      summary: List soft-deleted vault items (trash)
      responses:
        "200":
          description: List of trashed vault items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultTrashItem"

  /vault/{id}/restore:
    post:
      operationId: restoreVaultItem
      tags: [vault]
      summary: Restore a soft-deleted vault item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored vault item summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultTrashItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vault/{id}/permanent:
    delete:
      operationId: permanentDeleteVaultItem
      tags: [vault]
      summary: Permanently delete a vault item from trash
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Permanently deleted

  /vault/byID/{id}:
    get:
      operationId: getVaultItemById
      tags: [vault]
      summary: Get a vault item by its numeric ID (explicit path, supports API key auth)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vault item with entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItem"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vault/byName/{name}:
    get:
      operationId: getVaultItemByName
      tags: [vault]
      summary: Get a vault item by its name (case-insensitive, supports API key auth)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vault item with entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItem"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vault/stats:
    get:
      operationId: getVaultStats
      tags: [vault]
      summary: Get vault statistics summary
      responses:
        "200":
          description: Vault statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultStats"

  # API Keys
  /apikeys:
    get:
      operationId: listApiKeys
      tags: [apikeys]
      summary: List API keys for current user
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"

    post:
      operationId: createApiKey
      tags: [apikeys]
      summary: Generate a new API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyBody"
      responses:
        "201":
          description: Created API key (raw value shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"

  /apikeys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [apikeys]
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked

  # Certificates
  /certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List certificates for current user
      responses:
        "200":
          description: List of certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"

    post:
      operationId: generateCertificate
      tags: [certificates]
      summary: Generate a new client certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCertificateBody"
      responses:
        "201":
          description: Certificate generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateCreated"

  /certificates/{id}:
    delete:
      operationId: revokeCertificate
      tags: [certificates]
      summary: Revoke a certificate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked

  /certificates/{id}/download:
    get:
      operationId: downloadCertificate
      tags: [certificates]
      summary: Download certificate bundle (PEM)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Certificate PEM file download info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateDownload"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Audit Logs
  /logs:
    get:
      operationId: listAuditLogs
      tags: [logs]
      summary: List audit logs (last 30 days)
      parameters:
        - name: vaultItemId
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit log page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  /logs/stats:
    get:
      operationId: getAuditStats
      tags: [logs]
      summary: Audit log statistics (top accessed, recent activity)
      responses:
        "200":
          description: Audit stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStats"

  # Settings
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all application settings (admin only)
      responses:
        "200":
          description: List of settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"

  /settings/{key}:
    put:
      operationId: updateSetting
      tags: [settings]
      summary: Update a setting value (admin only)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingBody"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # Auth schemas
    RegisterBody:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        fullName:
          type: string
      required: [username, email, password, fullName]

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    ChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required: [currentPassword, newPassword]

    CheckResetResponse:
      type: object
      properties:
        requiresReset:
          type: boolean
        isActive:
          type: boolean
      required: [requiresReset, isActive]

    SetPasswordBody:
      type: object
      properties:
        username:
          type: string
        newPassword:
          type: string
      required: [username, newPassword]

    TwoFactorSetup:
      type: object
      properties:
        secret:
          type: string
        qrCodeUrl:
          type: string
        otpauthUrl:
          type: string
      required: [secret, qrCodeUrl, otpauthUrl]

    ConfirmTwoFactorBody:
      type: object
      properties:
        otp:
          type: string
      required: [otp]

    VerifyTwoFactorBody:
      type: object
      properties:
        tempToken:
          type: string
        otp:
          type: string
      required: [tempToken, otp]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
        requiresTwoFactor:
          type: boolean
        tempToken:
          type: string
      required: [user, token]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
        isActive:
          type: boolean
        requiresPasswordReset:
          type: boolean
        totpEnabled:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - username
        - email
        - fullName
        - role
        - isActive
        - requiresPasswordReset
        - totpEnabled
        - createdAt
        - updatedAt

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
        isActive:
          type: boolean
        requiresPasswordReset:
          type: boolean
        totpEnabled:
          type: boolean
      required:
        - id
        - username
        - email
        - fullName
        - role
        - isActive
        - requiresPasswordReset
        - totpEnabled

    UpdateUserBody:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        role:
          type: string

    # Vault schemas
    VaultEntry:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      required: [key, value]

    VaultItemSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        accessControl:
          type: string
        allowedHostsMode:
          type: string
        allowedHosts:
          type: array
          items:
            type: string
        entryCount:
          type: integer
        createdBy:
          type: integer
        createdByUsername:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - category
        - description
        - accessControl
        - allowedHostsMode
        - allowedHosts
        - entryCount
        - createdBy
        - createdByUsername
        - createdAt
        - updatedAt

    VaultItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        accessControl:
          type: string
        allowedUserIds:
          type: array
          items:
            type: integer
        allowedHostsMode:
          type: string
        allowedHosts:
          type: array
          items:
            type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/VaultEntry"
        createdBy:
          type: integer
        createdByUsername:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - category
        - description
        - accessControl
        - allowedUserIds
        - allowedHostsMode
        - allowedHosts
        - entries
        - createdBy
        - createdByUsername
        - createdAt
        - updatedAt

    CreateVaultItemBody:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        accessControl:
          type: string
        allowedUserIds:
          type: array
          items:
            type: integer
        allowedHostsMode:
          type: string
        allowedHosts:
          type: array
          items:
            type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/VaultEntry"
      required:
        - name
        - category
        - accessControl
        - entries

    UpdateVaultItemBody:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        accessControl:
          type: string
        allowedUserIds:
          type: array
          items:
            type: integer
        allowedHostsMode:
          type: string
        allowedHosts:
          type: array
          items:
            type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/VaultEntry"

    VaultTrashItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        accessControl:
          type: string
        allowedHostsMode:
          type: string
        allowedHosts:
          type: array
          items:
            type: string
        entryCount:
          type: integer
        createdBy:
          type: integer
        createdByUsername:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        deletedAt:
          type: string
      required:
        - id
        - name
        - category
        - description
        - accessControl
        - allowedHostsMode
        - allowedHosts
        - entryCount
        - createdBy
        - createdByUsername
        - createdAt
        - updatedAt
        - deletedAt

    VaultStats:
      type: object
      properties:
        totalItems:
          type: integer
        credentialCount:
          type: integer
        globalVarCount:
          type: integer
        totalEntries:
          type: integer
        accessibleToMe:
          type: integer
      required:
        - totalItems
        - credentialCount
        - globalVarCount
        - totalEntries
        - accessibleToMe

    # API Key schemas
    ApiKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        keyPrefix:
          type: string
        isActive:
          type: boolean
        lastUsedAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - keyPrefix
        - isActive
        - lastUsedAt
        - createdAt

    CreateApiKeyBody:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    ApiKeyCreated:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        keyPrefix:
          type: string
        rawKey:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - keyPrefix
        - rawKey
        - createdAt

    # Certificate schemas
    Certificate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        fingerprint:
          type: string
        isActive:
          type: boolean
        expiresAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - fingerprint
        - isActive
        - expiresAt
        - createdAt

    GenerateCertificateBody:
      type: object
      properties:
        name:
          type: string
        validityDays:
          type: integer
      required:
        - name
        - validityDays

    CertificateCreated:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        fingerprint:
          type: string
        isActive:
          type: boolean
        expiresAt:
          type: string
        createdAt:
          type: string
        pemBundle:
          type: string
      required:
        - id
        - name
        - fingerprint
        - isActive
        - expiresAt
        - createdAt
        - pemBundle

    CertificateDownload:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        pemBundle:
          type: string
        fingerprint:
          type: string
      required:
        - id
        - name
        - pemBundle
        - fingerprint

    # Audit Log schemas
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
        vaultItemId:
          type: integer
        vaultItemName:
          type: string
        action:
          type: string
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
        authMethod:
          type: ["string", "null"]
          description: '"api" para acesso via API Key, "browser" para sessão JWT'
        createdAt:
          type: string
      required:
        - id
        - userId
        - username
        - vaultItemId
        - vaultItemName
        - action
        - ipAddress
        - userAgent
        - authMethod
        - createdAt

    AuditLogPage:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required:
        - logs
        - total
        - page
        - pageSize

    AuditStats:
      type: object
      properties:
        totalAccesses:
          type: integer
        uniqueUsers:
          type: integer
        topAccessedItems:
          type: array
          items:
            $ref: "#/components/schemas/TopAccessedItem"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
      required:
        - totalAccesses
        - uniqueUsers
        - topAccessedItems
        - recentActivity

    TopAccessedItem:
      type: object
      properties:
        vaultItemId:
          type: integer
        vaultItemName:
          type: string
        accessCount:
          type: integer
      required:
        - vaultItemId
        - vaultItemName
        - accessCount

    # Settings schemas
    Setting:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      required: [key, value]

    UpdateSettingBody:
      type: object
      properties:
        value:
          type: string
      required: [value]
